name: symfony
version: "7"
label: Symfony
public_dir: public
create: composer create-project symfony/skeleton
php:
  min: "8.2"
  max: "8.4"

detect:
  - file: symfony.lock
  - composer: symfony/framework-bundle
    composer_sections: [flex-require]
    version_key: extra.symfony.require

env:
  file: .env.local
  example_file: .env
  format: dotenv
  url_key: DEFAULT_URI
  # DATABASE_URL carries no serverVersion: Doctrine picks its platform from that
  # string when it is set, and it cannot be spelled for a drop-in (a MariaDB server
  # given "11.8" is read as MySQL). Left out, Doctrine asks the server and is right
  # for every database and version.
  services:
    mysql:
      detect:
        - key: DATABASE_URL
          value_prefix: "mysql://"
        - key: DATABASE_URL
          value_prefix: "mariadb://"
      vars:
        - "DATABASE_URL=mysql://{{db_user}}:{{db_password}}@{{db_host}}:{{db_port}}/{{site}}"
    postgres:
      detect:
        - key: DATABASE_URL
          value_prefix: "postgresql://"
        - key: DATABASE_URL
          value_prefix: "postgres://"
      vars:
        - "DATABASE_URL=postgresql://{{db_user}}:{{db_password}}@{{db_host}}:{{db_port}}/{{site}}"
    redis:
      detect:
        - key: REDIS_URL
        - key: REDIS_DSN
      vars:
        - "REDIS_URL=redis://servlo-redis:6379"
    meilisearch:
      detect:
        - key: MEILISEARCH_HOST
        - key: MEILISEARCH_DSN
      vars:
        - "MEILISEARCH_HOST=http://servlo-meilisearch:7700"
  smtp:
    vars:
      - "MAILER_DSN=smtp://{{smtp_user_urlencoded}}:{{smtp_password_urlencoded}}@{{smtp_host}}:{{smtp_port}}"

composer: auto
npm: auto
console: bin/console

workers:
  messenger:
    label: Messenger
    command: php bin/console messenger:consume async --time-limit=3600
    restart: always
    check:
      composer: symfony/messenger

logs:
  - path: var/log/*.log
    format: monolog

setup:
  - label: Run migrations
    command: php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
    default: true
    check:
      composer: doctrine/doctrine-migrations-bundle
  - label: Load fixtures
    command: php bin/console doctrine:fixtures:load --no-interaction
    check:
      composer: doctrine/doctrine-fixtures-bundle
  - label: Clear cache
    command: php bin/console cache:clear
    default: true
  - label: Install assets
    command: php bin/console assets:install public
    default: true

commands:
  - name: cache:clear
    label: Clear cache
    command: bin/console cache:clear
    description: Clear the Symfony cache for the current environment
    output: silent
    icon: broom
  - name: doctrine:migrations:migrate
    label: Run migrations
    command: bin/console doctrine:migrations:migrate --no-interaction
    description: Apply pending Doctrine migrations
    output: silent
    icon: database
    check:
      composer: doctrine/doctrine-migrations-bundle
  - name: doctrine:fixtures:load
    label: Load fixtures
    command: bin/console doctrine:fixtures:load --no-interaction
    description: Wipe data and load fixtures
    output: silent
    confirm: true
    icon: refresh
    check:
      composer: doctrine/doctrine-fixtures-bundle

doctor:
  checks:
    - name: app_debug
      type: env_combo
      warn_if:
        APP_DEBUG: "true"
      detail: "APP_DEBUG is on, so the profiler and stack traces leak the site's internals to anyone who can provoke an error. Every servlo site is on a public domain, whatever APP_ENV says. Turn debug off."

# How servlo recognises a migration in a site's deploy script, which is what
# decides whether the deploy takes a database backup first. The full command
# name rather than the console path, so it matches however the script reaches
# bin/console. The d:m:m shorthand does not match and a script using it takes no
# backup.
deploy:
  migrate: [doctrine:migrations:migrate, d:m:m]

# What a backup leaves out. Everything here is rebuilt by a deploy or written
# again on the next request, so carrying it would grow every archive for nothing.
# var/cache is compiled on the next request and var/log is this server's own
# history, not the application's data.
backup:
  exclude:
    - vendor
    - node_modules
    - var/cache
    - var/log
