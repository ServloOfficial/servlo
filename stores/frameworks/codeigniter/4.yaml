name: codeigniter
version: "4"
label: CodeIgniter
public_dir: public
create: composer create-project codeigniter4/appstarter
php:
  min: "8.2"
  max: "8.4"

detect:
  - file: spark
  - composer: codeigniter4/framework

env:
  file: .env
  example_file: env
  format: dotenv
  url_key: app.baseURL
  vars:
    - "CI_ENVIRONMENT=development"
  key_generation:
    env_key: encryption.key
    command: key:generate
    fallback_prefix: "hex2bin:"
  services:
    mysql:
      detect:
        - key: database.default.DBDriver
          value_prefix: "MySQLi"
      vars:
        - "database.default.hostname={{db_host}}"
        - "database.default.database={{site}}"
        - "database.default.username={{db_user}}"
        - "database.default.password={{db_password}}"
        - "database.default.DBDriver=MySQLi"
        - "database.default.port={{db_port}}"
    postgres:
      detect:
        - key: database.default.DBDriver
          value_prefix: "Postgre"
      vars:
        - "database.default.hostname={{db_host}}"
        - "database.default.database={{site}}"
        - "database.default.username={{db_user}}"
        - "database.default.password={{db_password}}"
        - "database.default.DBDriver=Postgre"
        - "database.default.port={{db_port}}"
    redis:
      detect:
        - key: cache.handler
          value_prefix: "redis"
      vars:
        - "cache.handler=redis"
        - "cache.redis.host=servlo-redis"
        - "cache.redis.port=6379"
  smtp:
    vars:
      - "email.protocol=smtp"
      - "email.SMTPHost={{smtp_host}}"
      - "email.SMTPPort={{smtp_port}}"
      - "email.SMTPUser={{smtp_user}}"
      - "email.SMTPPass={{smtp_password}}"
      - "email.SMTPCrypto={{smtp_crypto}}"
      - "email.fromEmail={{smtp_from_address}}"
      - "email.fromName={{smtp_from_name}}"

composer: auto
npm: auto
console: spark

workers:
  queue:
    label: Queue Worker
    command: php spark queue:work default
    # Parameterized variant for `servlo queue:start --queue/--tries`. CI4 takes the
    # queue name positionally and has no per-job timeout flag, so timeout is omitted.
    tune_command: php spark queue:work {queue} -tries={tries}
    restart: always
    check:
      composer: codeigniter4/queue

logs:
  - path: writable/logs/*.log
    format: raw

setup:
  - label: Run migrations
    command: php spark migrate
    default: true
  - label: Clear cache
    command: php spark cache:clear
    default: true

commands:
  - name: cache:clear
    label: Clear cache
    command: php spark cache:clear
    description: Clear every configured cache pool
    output: silent
    icon: broom
  - name: migrate
    label: Run migrations
    command: php spark migrate
    description: Apply pending migrations
    output: silent
    icon: database
  - name: migrate:rollback
    label: Rollback migrations
    command: php spark migrate:rollback
    description: Roll back the last migration batch
    output: silent
    confirm: true
    icon: arrow-down
  - name: queue:retry
    label: Retry failed jobs
    command: php spark queue:retry all
    description: Retry every failed queue job
    output: silent
    icon: arrow-rotate-right
    check:
      composer: codeigniter4/queue
  - name: queue:failed
    label: Show failed jobs
    command: php spark queue:failed
    description: List failed queue jobs
    icon: list
    check:
      composer: codeigniter4/queue
  - name: queue:flush
    label: Flush failed jobs
    command: php spark queue:flush
    description: Remove all failed queue jobs
    output: silent
    confirm: true
    icon: trash
    check:
      composer: codeigniter4/queue

# How servlo recognises a migration in a site's deploy script, which is what
# decides whether the deploy takes a database backup first. Matched as a
# substring, so a rollback counts too, which is right: it changes the schema
# the same way and wants the same snapshot behind it.
deploy:
  migrate: php spark migrate

# What a backup leaves out. Everything here is rebuilt by a deploy or written
# again on the next request, so carrying it would grow every archive for nothing.
# writable/uploads stays: it is the application's data. Only the cache, log
# and session directories under writable/ are rebuildable.
backup:
  exclude:
    - vendor
    - node_modules
    - writable/cache
    - writable/logs
    - writable/session
