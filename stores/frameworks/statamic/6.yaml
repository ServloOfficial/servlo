name: statamic
version: "6"
label: Statamic
public_dir: public
create: composer create-project statamic/statamic
php:
  min: "8.3"
  max: "8.5"

detect:
  - composer: statamic/cms

env:
  file: .env
  example_file: .env.example
  format: dotenv
  key_generation:
    env_key: APP_KEY
    command: key:generate
    fallback_prefix: "base64:"
  services:
    mysql:
      detect:
        - key: DB_CONNECTION
          value_prefix: mysql
      vars:
        - DB_CONNECTION=mysql
        - DB_HOST={{db_host}}
        - DB_PORT={{db_port}}
        - DB_DATABASE={{site}}
        - DB_USERNAME={{db_user}}
        - DB_PASSWORD={{db_password}}
    postgres:
      detect:
        - key: DB_CONNECTION
          value_prefix: pgsql
      vars:
        - DB_CONNECTION=pgsql
        - DB_HOST={{db_host}}
        - DB_PORT={{db_port}}
        - DB_DATABASE={{site}}
        - DB_USERNAME={{db_user}}
        - DB_PASSWORD={{db_password}}
    redis:
      detect:
        - key: REDIS_HOST
      vars:
        - REDIS_HOST=servlo-redis
        - REDIS_PORT=6379
        - REDIS_PASSWORD=
  smtp:
    vars:
      - MAIL_MAILER=smtp
      - MAIL_HOST={{smtp_host}}
      - MAIL_PORT={{smtp_port}}
      - MAIL_USERNAME={{smtp_user}}
      - MAIL_PASSWORD={{smtp_password}}
      - MAIL_ENCRYPTION={{smtp_encryption}}
      - MAIL_FROM_ADDRESS={{smtp_from_address}}
      - MAIL_FROM_NAME="{{smtp_from_name}}"

composer: auto
npm: auto
console: artisan

workers:
  queue:
    label: Queue Worker
    command: php artisan queue:work --queue=default --tries=3 --timeout=60
    restart: always
  schedule:
    label: Task Scheduler
    command: php artisan schedule:work
    restart: always

logs:
  - path: storage/logs/*.log
    format: monolog

setup:
  - label: php artisan storage:link
    command: php artisan storage:link
    default: true
  - label: php please install
    command: php please install
    default: true
  - label: Refresh stache
    command: php please stache:refresh
    default: true
commands:
  - name: cache:clear
    label: Clear all caches
    command: php please cache:clear
    description: Clear Statamic and Laravel caches
    output: silent
    icon: broom
  - name: stache:warm
    label: Warm Stache
    command: php please stache:warm
    description: Pre-build the Stache index
    output: silent
    icon: refresh
  - name: search:update
    label: Update search
    command: php please search:update --all
    description: Reindex all configured search indexes
    output: silent
    icon: refresh

doctor:
  checks:
    - name: app_debug
      type: env_combo
      warn_if:
        APP_DEBUG: "true"
      detail: "APP_DEBUG is on, so a stack trace leaks the site's config and credentials to anyone who can provoke an error. Every servlo site is on a public domain, whatever APP_ENV says. Turn debug off."
    - name: storage_link
      type: symlink
      link: public/storage
      target: storage/app/public
      requires_dir: public
      detail: "public/storage symlink is missing, so files on the public disk won't be web-accessible. Run php please storage:link."

# What a backup leaves out. Everything here is rebuilt by a deploy or written
# again on the next request, so carrying it would grow every archive for nothing.
# Statamic keeps its content in content/, which is flat files and is exactly
# what has to survive, so only the rebuildable Laravel caches go.
backup:
  exclude:
    - vendor
    - node_modules
    - storage/framework/cache
    - storage/framework/views
    - bootstrap/cache
