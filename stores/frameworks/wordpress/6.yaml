name: wordpress
version: "6"
label: WordPress
public_dir: .
php:
  min: "7.4"
  max: "8.4"

detect:
  - file: wp-login.php
    version_file: wp-includes/version.php
    version_pattern: "\\$wp_version\\s*=\\s*'([^']+)'"
  - file: wp-config.php

env:
  fallback_file: wp-config.php
  fallback_format: php-const
  url_key: WP_HOME
  services:
    mysql:
      detect:
        - key: DB_HOST
      vars:
        - DB_NAME={{site}}
        - DB_USER={{db_user}}
        - DB_PASSWORD={{db_password}}
        - DB_HOST={{db_host}}
  smtp:
    vars:
      - SMTP_HOST={{smtp_host}}
      - SMTP_PORT={{smtp_port}}
      - SMTP_USER={{smtp_user}}
      - SMTP_PASS={{smtp_password}}
      - SMTP_SECURE={{smtp_crypto}}
      - SMTP_FROM={{smtp_from_address}}
      - SMTP_NAME={{smtp_from_name}}

logs:
  - path: wp-content/debug.log
    format: raw

composer: false
npm: false

commands:
  - name: cache:flush
    label: Flush cache
    command: wp cache flush
    description: Flush the WordPress object cache
    output: silent
    icon: broom
  - name: rewrite:flush
    label: Flush rewrites
    command: wp rewrite flush
    description: Regenerate permalink rules
    output: silent
    icon: refresh
  - name: db:export
    label: Export database
    command: wp db export
    description: Dump the database to a SQL file in the project directory
    output: text
    icon: database

# The production profile. WordPress is the case the exclude list exists for.
deploy:
  # Empty by default. A WordPress deploy is usually just the pull: themes and
  # plugins are managed through wp-admin on most installs, and a script that
  # assumed otherwise would fight the client.
  script: ""

  # WordPress has no migration command of its own. Schema changes happen inside
  # a plugin or core update, which servlo does not drive, so no deploy here is
  # treated as schema-changing and none takes a database backup on that basis.
  migrate: ""

  # The reason this field exists. Both of these are written by the client
  # through wp-admin and are not the repository's to own: uploads is every image
  # they have ever added, plugins is everything they have installed. A deploy
  # that removed either would destroy the site, and the operator would find out
  # from the client.
  exclude:
    - wp-content/uploads
    - wp-content/plugins

  # WordPress has no health endpoint that avoids the database, so the front page
  # is the honest check: if it answers, the site is up.
  health: /

# WordPress fires its scheduled work from page loads: wp-cron.php runs on a
# visitor's request, which means the schedule is only as reliable as the
# traffic, and every visitor pays for whatever was due. On a real server the
# fix is the one WordPress documents, so it is declared here rather than
# implemented anywhere: switch the page-load scheduler off and put the same
# work on a timer that runs whether or not anybody is looking.
pseudo_cron:
  label: WordPress cron
  description: wp-cron.php runs on page loads, so scheduled posts and updates wait for a visitor and every visitor pays for them.
  file: wp-config.php
  constant: DISABLE_WP_CRON
  # PHP literals, written unquoted. A quoted 'false' is a non-empty string and
  # PHP reads it as true, which would leave the site with no cron at all.
  replaced_value: "true"
  restored_value: "false"
  entry:
    id: wp-cron
    name: WordPress cron
    command: php wp-cron.php
    schedule: "* * * * *"
