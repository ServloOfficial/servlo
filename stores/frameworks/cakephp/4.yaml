name: cakephp
version: "4"
label: CakePHP
public_dir: webroot
create: composer create-project cakephp/app
php:
  min: "7.4"
  max: "8.3"

detect:
  - file: bin/cake
  - composer: cakephp/cakephp

env:
  file: config/.env
  example_file: config/.env.example
  format: dotenv
  url_key: APP_URL
  services:
    mysql:
      detect:
        - key: DATABASE_URL
          value_prefix: "mysql://"
      vars:
        - "DATABASE_URL=mysql://{{db_user}}:{{db_password}}@{{db_host}}:{{db_port}}/{{site}}"
    postgres:
      detect:
        - key: DATABASE_URL
          value_prefix: "postgres://"
      vars:
        - "DATABASE_URL=postgres://{{db_user}}:{{db_password}}@{{db_host}}:{{db_port}}/{{site}}"
    redis:
      detect:
        - key: CACHE_URL
          value_prefix: "redis://"
      vars:
        - "CACHE_URL=redis://servlo-redis:6379"
  smtp:
    vars:
      - "EMAIL_TRANSPORT_DEFAULT_URL=smtp://{{smtp_user_urlencoded}}:{{smtp_password_urlencoded}}@{{smtp_host}}:{{smtp_port}}?tls={{smtp_tls}}"

composer: auto
npm: auto
console: bin/cake.php

logs:
  - path: logs/*.log
    format: raw

setup:
  - label: Run migrations
    command: bin/cake migrations migrate
    default: true
  - label: Clear cache
    command: bin/cake cache clear_all
    default: true

commands:
  - name: cache:clear
    label: Clear all caches
    command: bin/cake cache clear_all
    description: Clear every configured cache pool
    output: silent
    icon: broom
  - name: migrate
    label: Run migrations
    command: bin/cake migrations migrate
    description: Apply pending migrations
    output: silent
    icon: database
    check:
      composer: cakephp/migrations
  - name: schema:cache:clear
    label: Clear schema cache
    command: bin/cake schema_cache clear
    description: Drop the cached database schema
    output: silent
    icon: refresh

# What a backup leaves out. Everything here is rebuilt by a deploy or written
# again on the next request, so carrying it would grow every archive for nothing.
# tmp/cache is regenerated on the next request; logs is this server's.
backup:
  exclude:
    - vendor
    - node_modules
    - tmp/cache
    - logs
