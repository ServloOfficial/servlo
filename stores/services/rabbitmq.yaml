name: rabbitmq
image: docker.io/library/rabbitmq:3-management-alpine
description: RabbitMQ message broker with management UI
ports:
  - "5672:5672"
  - "15672:15672"
environment:
  RABBITMQ_DEFAULT_USER: root
  RABBITMQ_DEFAULT_PASS: "{{password}}"
data_dir: /var/lib/rabbitmq
env_vars:
  - RABBITMQ_HOST=servlo-rabbitmq
  - RABBITMQ_PORT=5672
  - RABBITMQ_USER=root
  - RABBITMQ_PASSWORD={{password}}
  - RABBITMQ_VHOST=/
env_detect:
  key: RABBITMQ_HOST
dashboard: http://localhost:15672
# Cowboy session cookie has no SameSite override, so iframe login fails.
# Force the dashboard to open in a new tab to keep auth working.
dashboard_external: true
connection_url: amqp://root:{{password}}@127.0.0.1:5672/
files:
  - target: /etc/rabbitmq/conf.d/10-servlo-path-prefix.conf
    content: |
      management.path_prefix = /_svc/rabbitmq
category: messaging
icon: queue
