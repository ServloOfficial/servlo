name: mariadb
description: MariaDB (MySQL-compatible) versions
family: mariadb
env_role: mysql
default_version: "11.8"
init: true
versions:
  - tag: "12"
    label: "12 (latest)"
    image: docker.io/library/mariadb:12
    host_port: 3306
  - tag: "12.3"
    label: "12.3 LTS"
    image: docker.io/library/mariadb:12.3
    host_port: 3306
  - tag: "11.8"
    label: "11.8 LTS"
    image: docker.io/library/mariadb:11.8
    host_port: 3306
  - tag: "11.4"
    label: "11.4 LTS"
    image: docker.io/library/mariadb:11.4
    host_port: 3306
  - tag: "11"
    label: "11 (legacy)"
    image: docker.io/library/mariadb:11
    host_port: 3306
  - tag: "10.11"
    label: "10.11 LTS"
    image: docker.io/library/mariadb:10.11
    host_port: 3306
ports:
  - "{{host_port}}:3306"
data_dir: /var/lib/mysql
files:
  - target: /etc/mysql/conf.d/servlo.cnf
    content: |
      [mysqld]
      max_allowed_packet=256M
environment:
  MARIADB_ROOT_PASSWORD: "{{password}}"
  MARIADB_DATABASE: servlo
env_vars:
  - DB_CONNECTION=mysql
  - DB_HOST=servlo-mariadb-{{tag_safe}}
  - DB_PORT=3306
  - DB_DATABASE=servlo
  - DB_USERNAME=root
  - DB_PASSWORD={{password}}
connection_url: mysql://root:{{password}}@127.0.0.1:{{host_port}}/servlo
client_shims:
  - name: mysql
    binary: [mariadb, mysql]
  - name: mysqldump
    binary: [mariadb-dump, mysqldump]
category: databases
icon: database
# list_databases is kept alongside entities so servlo versions from before the
# entities schema still list the databases.
introspect:
  list_databases: >
    $(command -v mariadb || command -v mysql) -uroot -sN -e
    "SELECT s.SCHEMA_NAME, COALESCE(SUM(t.DATA_LENGTH + t.INDEX_LENGTH), 0)
    FROM information_schema.SCHEMATA s
    LEFT JOIN information_schema.TABLES t ON t.TABLE_SCHEMA = s.SCHEMA_NAME
    WHERE s.SCHEMA_NAME NOT IN ('information_schema', 'performance_schema', 'mysql', 'sys')
    GROUP BY s.SCHEMA_NAME ORDER BY s.SCHEMA_NAME"
  entities:
    - kind: databases
      # Dumping a database servlo does not host. The local export above runs
      # inside the engine's container and needs no address; this one is aimed,
      # so it takes the host, port, administrator and TLS spelling from the
      # connection. The password arrives in MYSQL_PWD, never in the argv.
      image: docker.io/library/mariadb:11.8
      tls:
        require: "--ssl-mode=REQUIRED"
        verify-ca: "--ssl-mode=VERIFY_CA --ssl-ca={{ca_cert}}"
      format: sql
      list: >
        $(command -v mariadb || command -v mysql) -uroot -sN -e
        "SELECT s.SCHEMA_NAME, COALESCE(SUM(t.DATA_LENGTH + t.INDEX_LENGTH), 0)
        FROM information_schema.SCHEMATA s
        LEFT JOIN information_schema.TABLES t ON t.TABLE_SCHEMA = s.SCHEMA_NAME
        WHERE s.SCHEMA_NAME NOT IN ('information_schema', 'performance_schema', 'mysql', 'sys')
        GROUP BY s.SCHEMA_NAME ORDER BY s.SCHEMA_NAME"
      columns:
        - key: size
          label: Size
          format: bytes
      actions:
        remote_export: >
          $(command -v mysqldump || command -v mariadb-dump)
          -h {{host}} -P {{port}} -u {{admin_user}} {{tls_flags}}
          --single-transaction --quick --no-tablespaces --routines --triggers --events
          {{database}}
        remote_import: >
          $(command -v mysql || command -v mariadb) --max-allowed-packet=1G
          -h {{host}} -P {{port}} -u {{admin_user}} {{tls_flags}} {{database}}
        remote_create: >
          $(command -v mysql || command -v mariadb)
          -h {{host}} -P {{port}} -u {{admin_user}} {{tls_flags}} -e
          'CREATE DATABASE IF NOT EXISTS `{{database}}`;'
        remote_drop: >
          $(command -v mysql || command -v mariadb)
          -h {{host}} -P {{port}} -u {{admin_user}} {{tls_flags}} -e
          'DROP DATABASE IF EXISTS `{{database}}`;'
        remote_count_tables: >
          $(command -v mysql || command -v mariadb)
          -h {{host}} -P {{port}} -u {{admin_user}} {{tls_flags}} -sN -e
          "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = '{{database}}'"
        create: >
          $(command -v mariadb || command -v mysql) -uroot -e
          'CREATE DATABASE IF NOT EXISTS `{{name}}`;'
        drop:
          exec: >
            $(command -v mariadb || command -v mysql) -uroot -e
            'DROP DATABASE IF EXISTS `{{name}}`;'
          destructive: true
        export:
          exec: >
            $(command -v mariadb-dump || command -v mysqldump) -uroot
            --single-transaction --quick --no-tablespaces --routines --triggers --events
            {{name}}
          filename: "{{name}}.sql"
        import: >
          $(command -v mariadb || command -v mysql) --max-allowed-packet=1G -uroot {{name}}
        export_all: >
          $(command -v mariadb-dump || command -v mysqldump) -uroot
          --single-transaction --quick --no-tablespaces --routines --triggers --events
          --add-drop-database --all-databases
        import_all: >
          $(command -v mariadb || command -v mysql) --max-allowed-packet=1G -uroot
    # The account a site reaches its own database as, so one site's code cannot
    # read the site next door. Every statement takes its host, port and
    # administrator from the connection the site is on, so the same declaration
    # provisions a container here and a managed server somewhere else.
    - kind: site_users
      image: docker.io/library/mariadb:11.8
      # MariaDB's client spells TLS its own way: --ssl rather than MySQL's
      # --ssl-mode, and a CA file is what turns verification on. Which is the
      # point of declaring the flags here instead of deriving them in Go.
      tls:
        require: "--ssl"
        verify-ca: "--ssl --ssl-ca={{ca_cert}}"
      actions:
        create: >
          $(command -v mariadb || command -v mysql) -h {{host}} -P {{port}} -u {{admin_user}} {{tls_flags}} -e
          "CREATE USER IF NOT EXISTS '{{name}}'@'%' IDENTIFIED BY '{{user_password}}';"
        rotate: >
          $(command -v mariadb || command -v mysql) -h {{host}} -P {{port}} -u {{admin_user}} {{tls_flags}} -e
          "ALTER USER '{{name}}'@'%' IDENTIFIED BY '{{user_password}}'; FLUSH PRIVILEGES;"
        grant: >
          $(command -v mariadb || command -v mysql) -h {{host}} -P {{port}} -u {{admin_user}} {{tls_flags}} -e
          "GRANT ALL PRIVILEGES ON \`{{database}}\`.* TO '{{name}}'@'%'; FLUSH PRIVILEGES;"
        drop:
          exec: >
            $(command -v mariadb || command -v mysql) -h {{host}} -P {{port}} -u {{admin_user}} {{tls_flags}} -e
            "DROP USER IF EXISTS '{{name}}'@'%';"
          destructive: true
