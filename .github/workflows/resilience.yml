name: Resilience

# The two claims Phase 4 makes that a unit test cannot check, because both are
# about what survives losing the machine.
#
#   reboot   — every site, service and worker comes back unaided (S19.2)
#   rebuild  — a fresh machine plus the backups is the old machine (S16.1)
#   tls      — a site gets a real certificate from a real authority (S3.1)
#
# All three run against real podman, real systemd user units and real HTTP.
# They are in their own workflow rather than in ci.yml because they take
# minutes rather than seconds, and because when one of them goes red the thing
# that broke is a different kind of thing from a failing unit test.

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]

env:
  # The site the jobs create and then ask for. A real FQDN with no DNS
  # anywhere, resolved at the curl rather than written into a hosts file:
  # servlo never touches a host resolver (CLAUDE.md §3.1) and neither does its
  # own CI.
  SITE: ci-one.example
  SITE_TWO: ci-two.example

jobs:
  reboot:
    name: Everything comes back on its own
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: internal/ui/web/package-lock.json

      - name: Prepare the rootless runtime
        run: .github/scripts/prepare-runtime.sh

      - name: Install servlo
        run: .github/scripts/install-servlo.sh

      - name: Create a site
        run: .github/scripts/make-site.sh "$SITE"

      - name: It serves before anything is stopped
        run: .github/scripts/expect-serving.sh "$SITE"

      # The boot path, without a kernel.
      #
      # Stopping every servlo unit and then starting default.target is exactly
      # what the user manager does when a lingering user's session starts at
      # boot: it pulls in everything WantedBy=default.target and nothing else.
      # A unit that servlo wrote but never enabled does not come back here, and
      # that is precisely the bug this job exists to catch.
      #
      # Be straight about the difference: this does not reboot the kernel, so it
      # does not cover a container image that fails to start from a cold page
      # cache, or a tmpfs that a reboot empties. Those belong to the droplet
      # pass. What it does cover is the enablement, which is where the failure
      # has always actually been.
      - name: Stop everything, then start the way a boot does
        run: .github/scripts/simulate-boot.sh

      - name: It serves again, with nobody running servlo start
        run: .github/scripts/expect-serving.sh "$SITE"

      - name: Every unit servlo installed is enabled
        run: .github/scripts/expect-enabled.sh

      # The server's own state backup is armed and its unit actually runs. A
      # timer whose ExecStart is wrong looks identical to a working one until
      # the night it does not fire, and the archive it does not write is the
      # one a rebuild needs.
      - name: The server backs its own state up on a timer
        run: |
          set -euo pipefail
          systemctl --user is-enabled servlo-backup-state.timer
          systemctl --user start servlo-backup-state.service
          shopt -s nullglob
          archives=(~/.local/share/servlo/site-backups/servlo-state-*.servlobak)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "the state backup unit ran and wrote no archive"
            systemctl --user status servlo-backup-state.service --no-pager || true
            journalctl --user -u servlo-backup-state.service --no-pager | tail -40 || true
            exit 1
          fi
          echo "the timer's own unit wrote ${archives[0]}"

      - name: What the runtime looked like
        if: always()
        run: |
          systemctl --user list-units 'servlo-*' --all --no-pager || true
          podman ps -a || true

  tls:
    name: A site gets a real certificate from a real authority
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: internal/ui/web/package-lock.json

      - name: Prepare the rootless runtime
        run: .github/scripts/prepare-runtime.sh

      - name: Install servlo
        run: .github/scripts/install-servlo.sh

      # The other jobs use a name that resolves nowhere and reach it with
      # curl --resolve. That cannot work here: an HTTP-01 challenge is the
      # authority looking the name up itself and connecting to what it finds,
      # so the name has to genuinely resolve to this runner.
      #
      # sslip.io answers any <dashed-ip>.sslip.io with that address, which
      # makes the runner's own address a real, publicly resolvable domain for
      # as long as the job runs. Nothing is registered and nothing is written
      # to a resolver on this machine — servlo never touches one (CLAUDE.md
      # §3.1) and neither does its CI.
      - name: Name this runner
        run: |
          set -euo pipefail
          ip=$(ip -4 -o route get 1.1.1.1 | awk '{for (i=1;i<NF;i++) if ($i=="src") print $(i+1)}')
          echo "TLS_SITE=${ip//./-}.sslip.io" >> "$GITHUB_ENV"
          echo "RUNNER_IP=$ip" >> "$GITHUB_ENV"

      - name: Stand up an ACME server
        run: .github/scripts/start-acme-server.sh

      # No CLI writes these, by design: an authority is a machine-level setting
      # an operator picks once. CI is the operator here, the same way it is for
      # the sysctl in prepare-runtime.sh.
      - name: Point servlo at it
        run: |
          set -euo pipefail
          cfg=~/.config/servlo/config.yaml
          yq -i '.certs.directory_url = "https://localhost:14000/dir"' "$cfg"
          yq -i '.certs.email = "ci@servlo.invalid"' "$cfg"
          yq -i ".certs.server_addresses = [\"$RUNNER_IP\"]" "$cfg"
          yq '.certs' "$cfg"

      - name: Create the site
        run: .github/scripts/make-site.sh "$TLS_SITE" servlo_ci_tls

      - name: It serves over plain http first
        run: .github/scripts/expect-serving.sh "$TLS_SITE"

      - name: Secure it
        run: servlo secure "$TLS_SITE"

      - name: It serves over HTTPS, and renewal can still be validated
        run: .github/scripts/expect-secured.sh "$TLS_SITE"

      # Reissuing is not the same code path as issuing: it has to replace a
      # certificate nginx currently holds open, and reload without dropping the
      # site. With Pebble's authorization reuse switched off in
      # start-acme-server.sh this revalidates over http as well, which is what
      # makes it the ninety-day event compressed rather than a second issuance.
      # Renewing, with the count of http-01 validations taken on either side.
      # Said out loud because a renewal that quietly reused its authorization
      # would pass every check below it while proving nothing: the challenge
      # path is the half that breaks in ninety days, and an issuance that skips
      # it cannot fail. Compared rather than thresholded — Pebble validates
      # from three perspectives, so any fixed number is a number that happens
      # to be right for one shape of run.
      - name: Renew it, and prove it revalidated
        run: |
          set -euo pipefail
          before=$(grep -c 'Attempting to validate w/ HTTP' /tmp/pebble.log || true)
          servlo secure "$TLS_SITE" --renew
          after=$(grep -c 'Attempting to validate w/ HTTP' /tmp/pebble.log || true)
          echo "http-01 validation attempts: $before before the renewal, $after after"
          if [ "${after:-0}" -le "${before:-0}" ]; then
            echo "the renewal issued without revalidating, so nothing tested the challenge path"
            grep -E 'validate|Issued certificate|authz' /tmp/pebble.log || true
            exit 1
          fi

      - name: It still serves over HTTPS after the renewal
        run: .github/scripts/expect-secured.sh "$TLS_SITE"

      - name: Unsecure it, and it goes back to plain http
        run: |
          set -euo pipefail
          servlo unsecure "$TLS_SITE"
          .github/scripts/expect-serving.sh "$TLS_SITE"

      - name: What the runtime looked like
        if: always()
        run: |
          servlo status || true
          ls -la ~/.local/share/servlo/acme/ || true
          systemctl --user list-units 'servlo-*' --all --no-pager || true
          podman ps -a || true
          tail -100 /tmp/pebble.log || true

  rebuild-source:
    name: The server that is about to be lost
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      # The backup key for this run only. Generated here, used by the job
      # below, and it encrypts nothing but the fixture site this workflow
      # creates. A real key never leaves the server it was generated on.
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: internal/ui/web/package-lock.json

      - name: Prepare the rootless runtime
        run: .github/scripts/prepare-runtime.sh

      - name: Install servlo
        run: .github/scripts/install-servlo.sh

      - name: Create two sites
        run: |
          .github/scripts/make-site.sh "$SITE"
          .github/scripts/make-site.sh "$SITE_TWO"

      - name: Give one of them a setting worth losing
        run: |
          set -euo pipefail
          servlo backup schedule "$SITE" daily --daily 3 --weekly 2 --monthly 1
          servlo backup schedule "$SITE" | tee /tmp/schedule-before.txt

      # A setting in the registry is the easy half. These are the files the
      # operator wrote by hand, which servlo promises never to overwrite and
      # which nothing can reconstruct from anywhere else. They live under the
      # data directory, so an archive that took only sites.yaml out of it left
      # the rebuilt machine with stock tuning and no custom nginx.
      - name: Write the things only the operator knows
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/servlo/nginx/custom.d
          mkdir -p ~/.local/share/servlo/nginx/http.d
          mkdir -p ~/.local/share/servlo/service-tuning
          mkdir -p ~/.local/share/servlo/php/shared
          echo 'add_header X-Rebuilt-Custom "yes" always;' > ~/.local/share/servlo/nginx/custom.d/"$SITE".conf
          echo 'client_max_body_size 512m;' > ~/.local/share/servlo/nginx/http.d/zz-servlo-user.conf
          printf '[mysqld]\nmax_allowed_packet = 1G\n' > ~/.local/share/servlo/service-tuning/mysql.conf
          echo 'memory_limit = 512M' > ~/.local/share/servlo/php/shared/95-shared.ini

      - name: They both serve
        run: |
          .github/scripts/expect-serving.sh "$SITE"
          .github/scripts/expect-serving.sh "$SITE_TWO"

      - name: Read the backup key
        id: key
        run: |
          set -euo pipefail
          # Touching a backup generates the key, so this is the first command
          # that has one to read. Not silenced: when it fails, its own output is
          # the only thing that says why.
          servlo backup "$SITE"
          echo "key=$(cat ~/.config/servlo/backup.key)" >> "$GITHUB_OUTPUT"

      - name: Back up everything
        run: |
          set -euo pipefail
          servlo backup "$SITE_TWO"
          servlo backup state
          ls -la ~/.local/share/servlo/site-backups/

      - uses: actions/upload-artifact@v4
        with:
          name: rebuild-archives
          path: ~/.local/share/servlo/site-backups/
          retention-days: 1
          if-no-files-found: error

  rebuild-target:
    name: A fresh machine plus the backups is the old machine
    needs: rebuild-source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: internal/ui/web/package-lock.json

      - name: Prepare the rootless runtime
        run: .github/scripts/prepare-runtime.sh

      # Deliberately nothing else: no sites, no registry, no settings. This
      # runner has never seen the machine the archives came from, which is the
      # whole point of the job.
      - name: Install servlo, and nothing else
        run: .github/scripts/install-servlo.sh

      - uses: actions/download-artifact@v4
        with:
          name: rebuild-archives
          path: /tmp/archives

      - name: The key comes first
        env:
          BACKUP_KEY: ${{ needs.rebuild-source.outputs.key }}
        run: |
          set -euo pipefail
          # Without it nothing opens: servlo generates a key of its own on a
          # new machine and it opens nothing the old one wrote.
          servlo backup key import "$BACKUP_KEY"

      - name: Restore the server's own state
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/servlo/site-backups
          cp /tmp/archives/*.servlobak ~/.local/share/servlo/site-backups/
          state=$(ls -1 ~/.local/share/servlo/site-backups/servlo-state-*.servlobak | head -1)
          servlo restore "$(basename "$state")" --state --yes

      # The engine has to be rebuilt on top of the state, not merely running
      # under it. servlo's service password lives in the config directory a
      # state archive carries, and MySQL bakes the password it is handed into
      # its data directory the first time it starts, so the engine installed
      # above still holds this runner's password while the restored config holds
      # the old machine's. Reinstalling recreates the container from the
      # restored config and, with --reset-data, gives each restored site its
      # database back to load a dump into.
      - name: Rebuild the engine on the restored credentials
        run: servlo service reinstall mysql --reset-data

      # A restore loads a dump into the engine, so the engine has to be
      # answering first. Nothing between here and there waits for it.
      - name: Wait for the database engine
        run: .github/scripts/wait-for-db.sh

      - name: Restore each site
        run: |
          set -euo pipefail
          for archive in ~/.local/share/servlo/site-backups/*.servlobak; do
            name=$(basename "$archive")
            case "$name" in servlo-state-*) continue ;; esac
            servlo restore "$name" --yes
          done

      - name: Bring it up
        run: |
          set -euo pipefail
          servlo start
          servlo sites

      - name: Every site serves
        run: |
          .github/scripts/expect-serving.sh "$SITE"
          .github/scripts/expect-serving.sh "$SITE_TWO"

      - name: The data came back too
        run: |
          set -euo pipefail
          cd "$HOME/sites/$SITE"
          servlo db:export --output /tmp/rebuilt.sql
          if ! grep -q "$SITE survived" /tmp/rebuilt.sql; then
            echo "the row this site had before the rebuild is not in its database"
            head -40 /tmp/rebuilt.sql
            exit 1
          fi

      - name: The settings came back with them
        run: |
          set -euo pipefail
          servlo backup schedule "$SITE" | tee /tmp/schedule-after.txt
          if ! grep -q 'daily' /tmp/schedule-after.txt; then
            echo "the site's backup schedule did not survive the rebuild"
            cat /tmp/schedule-after.txt
            exit 1
          fi

      # The half a registry cannot carry. Each of these was typed by a person
      # and is not derivable from anything else on the machine, so a rebuild
      # that loses them is a rebuild that quietly reverts the operator's tuning
      # on a server they have just been told came back.
      - name: What the operator wrote came back too
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ ! -f "$1" ]; then
              echo "missing after the rebuild: $1"
              fail=1
              return
            fi
            if ! grep -qF "$2" "$1"; then
              echo "$1 came back without what was in it (wanted: $2)"
              cat "$1"
              fail=1
            fi
          }
          check ~/.local/share/servlo/nginx/custom.d/"$SITE".conf 'X-Rebuilt-Custom'
          check ~/.local/share/servlo/nginx/http.d/zz-servlo-user.conf 'client_max_body_size 512m'
          check ~/.local/share/servlo/service-tuning/mysql.conf 'max_allowed_packet = 1G'
          check ~/.local/share/servlo/php/shared/95-shared.ini 'memory_limit = 512M'
          exit $fail

      - name: What the rebuilt server looks like
        if: always()
        run: |
          servlo status || true
          systemctl --user list-units 'servlo-*' --all --no-pager || true
