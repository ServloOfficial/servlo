name: Release

on:
  push:
    tags:
      - "v*"

# A tag is the artefact people actually install, so the gate in front of it is
# the same one a pull request passes, on the same pinned runner. It used to be a
# shorter list on ubuntu-latest, which meant a release was checked less than the
# commit it was cut from: no surface scan, no panel suite, no race detector, and
# a runner that drifts to the next LTS while servlo refuses everything but 24.04.
jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: internal/ui/web/package-lock.json

      # Without a user manager and a session bus the systemd tests skip rather
      # than run, so `go test ./...` passes having checked less than it looks.
      - name: Prepare the rootless runtime
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          for _ in $(seq 30); do
            if [ -S "/run/user/$uid/bus" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "the user session bus never appeared at /run/user/$uid/bus"
          exit 1

      - name: Build UI
        run: make build-ui

      - name: Test the panel
        run: make test-ui

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -o /dev/null ./cmd/servlo

      - name: Test
        run: go test ./...

      - name: Test under the race detector
        run: go test -race $(go list ./... | grep -v /internal/surfacescan)

      - name: Vet
        run: go vet ./...

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Surface scan
        run: make surface-scan

  installer:
    name: Installer Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      # install.sh ships inside the archive this tag publishes, so the release
      # is the last place it can be wrong.
      - name: Run installer tests
        run: bats tests/installer/installer.bats

  release:
    name: GoReleaser
    needs: [ci, installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for changelog generation

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: internal/ui/web/package-lock.json

      - name: Build UI
        run: make build-ui

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
