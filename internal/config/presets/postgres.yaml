name: postgres
default: true
update_strategy: minor
track_latest: true
description: PostgreSQL with PostGIS
family: postgres
default_version: "16"
versions:
  - tag: "18"
    label: "18"
    image: docker.io/postgis/postgis:18-3.6-alpine
    host_port: 5432
  - tag: "17"
    label: "17"
    image: docker.io/postgis/postgis:17-3.6-alpine
    host_port: 5432
  - tag: "16"
    label: "16 (default)"
    image: docker.io/postgis/postgis:16-3.5-alpine
    canonical: true
    host_port: 5432
ports:
  - "{{host_port}}:5432"
data_dir: /var/lib/postgresql/data
data_version_file: PG_VERSION
environment:
  POSTGRES_PASSWORD: "{{password}}"
  POSTGRES_DB: servlo
  PGDATA: /var/lib/postgresql/data
env_vars:
  - DB_CONNECTION=pgsql
  - DB_HOST=servlo-{{name}}
  - DB_PORT=5432
  - DB_DATABASE=servlo
  - DB_USERNAME=postgres
  - DB_PASSWORD={{password}}
connection_url: postgresql://postgres:{{password}}@127.0.0.1:{{host_port}}/servlo
client_shims:
  - psql
  - pg_dump
  - pg_dumpall
  - pg_restore
category: databases
icon: elephant
introspect:
  entities:
    - kind: databases
      # Dumping a database servlo does not host. The local export above runs
      # inside the engine's container and needs no address; this one is aimed,
      # so it takes the host, port, administrator and TLS spelling from the
      # connection. The password arrives in PGPASSWORD, never in the argv.
      tls:
        require: "?sslmode=require"
        verify-ca: "?sslmode=verify-ca&sslrootcert={{ca_cert}}"
      format: sql
      list: >
        psql -U postgres -tAc
        "SELECT datname || chr(9) || GREATEST(pg_database_size(datname)
        - (SELECT pg_database_size('template1')), 0) FROM pg_database
        WHERE datistemplate = false AND datname <> 'postgres' ORDER BY datname"
      columns:
        - key: size
          label: Size
          format: bytes
      actions:
        remote_export:
          image: docker.io/library/postgres:16-alpine
          exec: >
            pg_dump "postgresql://{{admin_user}}@{{host}}:{{port}}/{{database}}{{tls_flags}}"
            --clean --if-exists --no-owner --no-privileges
        remote_import:
          image: docker.io/library/postgres:16-alpine
          exec: >
            psql "postgresql://{{admin_user}}@{{host}}:{{port}}/{{database}}{{tls_flags}}"
            -v ON_ERROR_STOP=1
        remote_create:
          image: docker.io/library/postgres:16-alpine
          exec: >
            psql "postgresql://{{admin_user}}@{{host}}:{{port}}/postgres{{tls_flags}}" -tAc
            "SELECT 1 FROM pg_database WHERE datname = '{{database}}'" | grep -q 1 ||
            psql "postgresql://{{admin_user}}@{{host}}:{{port}}/postgres{{tls_flags}}" -v ON_ERROR_STOP=1 -c
            'CREATE DATABASE "{{database}}"'
        remote_drop:
          image: docker.io/library/postgres:16-alpine
          exec: >
            psql "postgresql://{{admin_user}}@{{host}}:{{port}}/postgres{{tls_flags}}" -v ON_ERROR_STOP=1 -c
            'DROP DATABASE IF EXISTS "{{database}}"'
        remote_count_tables:
          image: docker.io/library/postgres:16-alpine
          exec: >
            psql "postgresql://{{admin_user}}@{{host}}:{{port}}/{{database}}{{tls_flags}}" -tAc
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog','information_schema')"
        create: psql -U postgres -c 'CREATE DATABASE "{{name}}";'
        drop:
          exec: psql -U postgres -c 'DROP DATABASE IF EXISTS "{{name}}" WITH (FORCE);'
          destructive: true
        export:
          exec: pg_dump -U postgres --clean --if-exists {{name}}
          filename: "{{name}}.sql"
        import: psql -U postgres -d {{name}}
        export_all: pg_dumpall -U postgres --clean --if-exists
        import_all: psql -U postgres -d postgres
    # The account a site reaches its own database as, so one site's code cannot
    # read the site next door. Every statement takes its host, port and
    # administrator from the connection the site is on, so the same declaration
    # provisions a container here and a managed server somewhere else. The site
    # owns its own database and the public schema inside it, which is what lets
    # a migration create tables without any rights outside that one database.
    - kind: site_users
      image: docker.io/library/postgres:16-alpine
      tls:
        require: "?sslmode=require"
        verify-ca: "?sslmode=verify-ca&sslrootcert={{ca_cert}}"
      actions:
        create: >
          psql "postgresql://{{admin_user}}@{{host}}:{{port}}/postgres{{tls_flags}}" -tAc
          "SELECT 1 FROM pg_roles WHERE rolname = '{{name}}'" | grep -q 1 ||
          psql "postgresql://{{admin_user}}@{{host}}:{{port}}/postgres{{tls_flags}}" -v ON_ERROR_STOP=1 -c
          "CREATE ROLE \"{{name}}\" LOGIN PASSWORD '{{user_password}}'"
        rotate: >
          psql "postgresql://{{admin_user}}@{{host}}:{{port}}/postgres{{tls_flags}}" -v ON_ERROR_STOP=1 -c
          "ALTER ROLE \"{{name}}\" WITH PASSWORD '{{user_password}}'"
        grant: >
          psql "postgresql://{{admin_user}}@{{host}}:{{port}}/{{database}}{{tls_flags}}" -v ON_ERROR_STOP=1
          -c "GRANT CONNECT ON DATABASE \"{{database}}\" TO \"{{name}}\""
          -c "ALTER DATABASE \"{{database}}\" OWNER TO \"{{name}}\""
          -c "ALTER SCHEMA public OWNER TO \"{{name}}\""
          -c "GRANT ALL ON SCHEMA public TO \"{{name}}\""
        drop:
          exec: >
            psql "postgresql://{{admin_user}}@{{host}}:{{port}}/postgres{{tls_flags}}" -c
            "DROP ROLE IF EXISTS \"{{name}}\""
          destructive: true
extensions:
  - name: postgis
    types: [geometry, geography]
  - name: postgis_raster
    types: [raster]
  - name: postgis_topology
    types: [topogeometry]
