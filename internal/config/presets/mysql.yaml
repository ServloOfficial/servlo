name: mysql
default: true
update_strategy: minor
track_latest: true
description: MySQL database
family: mysql
default_version: "8.4"
init: true
versions:
  - tag: "9.7"
    label: "9.7 LTS"
    image: docker.io/library/mysql:9.7
    host_port: 3306
  - tag: "8.4"
    label: "8.4 LTS (default)"
    image: docker.io/library/mysql:8.4
    canonical: true
    host_port: 3306
  - tag: "5.7"
    label: "5.7"
    image: docker.io/library/mysql:5.7
    host_port: 3306
ports:
  - "{{host_port}}:3306"
data_dir: /var/lib/mysql
environment:
  MYSQL_ROOT_PASSWORD: "{{password}}"
  MYSQL_DATABASE: servlo
env_vars:
  - DB_CONNECTION=mysql
  - DB_HOST=servlo-{{name}}
  - DB_PORT=3306
  - DB_DATABASE=servlo
  - DB_USERNAME=root
  - DB_PASSWORD={{password}}
connection_url: mysql://root:{{password}}@127.0.0.1:{{host_port}}/servlo
client_shims:
  - mysql
  - mysqldump
files:
  - target: /etc/mysql/conf.d/servlo.cnf
    content: |
      [mysqld]
      character-set-server=utf8mb4
      collation-server=utf8mb4_unicode_ci
      max_allowed_packet=256M
      innodb_file_per_table=ON
      innodb_strict_mode=OFF
      loose-innodb_default_row_format=DYNAMIC
      loose-mysql-native-password=ON
      loose-restrict-fk-on-non-standard-key=OFF
category: databases
icon: database
introspect:
  entities:
    - kind: databases
      format: sql
      list: >
        $(command -v mysql || command -v mariadb) -uroot -sN -e
        "SELECT s.SCHEMA_NAME, COALESCE(SUM(t.DATA_LENGTH + t.INDEX_LENGTH), 0)
        FROM information_schema.SCHEMATA s
        LEFT JOIN information_schema.TABLES t ON t.TABLE_SCHEMA = s.SCHEMA_NAME
        WHERE s.SCHEMA_NAME NOT IN ('information_schema', 'performance_schema', 'mysql', 'sys')
        GROUP BY s.SCHEMA_NAME ORDER BY s.SCHEMA_NAME"
      columns:
        - key: size
          label: Size
          format: bytes
      actions:
        create: >
          $(command -v mysql || command -v mariadb) -uroot -e
          'CREATE DATABASE IF NOT EXISTS `{{name}}`;'
        drop:
          exec: >
            $(command -v mysql || command -v mariadb) -uroot -e
            'DROP DATABASE IF EXISTS `{{name}}`;'
          destructive: true
        export:
          exec: >
            $(command -v mysqldump || command -v mariadb-dump) -uroot
            --single-transaction --quick --no-tablespaces --routines --triggers --events
            {{name}}
          filename: "{{name}}.sql"
        import: >
          $(command -v mysql || command -v mariadb) --max-allowed-packet=1G -uroot {{name}}
        export_all: >
          $(command -v mysqldump || command -v mariadb-dump) -uroot
          --single-transaction --quick --no-tablespaces --routines --triggers --events
          --add-drop-database --all-databases
        import_all: >
          $(command -v mysql || command -v mariadb) --max-allowed-packet=1G -uroot
