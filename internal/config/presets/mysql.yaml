name: mysql
default: true
update_strategy: minor
track_latest: true
description: MySQL database
family: mysql
default_version: "8.4"
init: true
versions:
  - tag: "9.7"
    label: "9.7 LTS"
    image: docker.io/library/mysql:9.7
    host_port: 3306
  - tag: "8.4"
    label: "8.4 LTS (default)"
    image: docker.io/library/mysql:8.4
    canonical: true
    host_port: 3306
  - tag: "5.7"
    label: "5.7"
    image: docker.io/library/mysql:5.7
    host_port: 3306
ports:
  - "{{host_port}}:3306"
data_dir: /var/lib/mysql
environment:
  MYSQL_ROOT_PASSWORD: "{{password}}"
  MYSQL_DATABASE: servlo
env_vars:
  - DB_CONNECTION=mysql
  - DB_HOST=servlo-{{name}}
  - DB_PORT=3306
  - DB_DATABASE=servlo
  - DB_USERNAME=root
  - DB_PASSWORD={{password}}
connection_url: mysql://root:{{password}}@127.0.0.1:{{host_port}}/servlo
client_shims:
  - mysql
  - mysqldump
files:
  - target: /etc/mysql/conf.d/servlo.cnf
    content: |
      [mysqld]
      character-set-server=utf8mb4
      collation-server=utf8mb4_unicode_ci
      max_allowed_packet=256M
      innodb_file_per_table=ON
      innodb_strict_mode=OFF
      loose-innodb_default_row_format=DYNAMIC
      loose-mysql-native-password=ON
      loose-restrict-fk-on-non-standard-key=OFF
category: databases
icon: database
introspect:
  # Every command that runs inside the engine's own container still names
  # -h 127.0.0.1, which looks redundant and is not.
  #
  # The client's compiled-in socket path and the server's configured one are
  # two different settings, and in this image they disagree: mysqld listens on
  # /var/lib/mysql/mysql.sock and the client looks for
  # /var/run/mysqld/mysqld.sock. Left to the default, every local command fails
  # with "Can't connect to local MySQL server through socket", on an engine that
  # is running perfectly well. Naming the address forces TCP to the port the
  # server is already listening on, which is also what every site connects over,
  # and it does not care where either side thinks the socket lives.
  entities:
    - kind: databases
      # No image at this level, and that is load-bearing rather than an
      # omission. An image on the entity sends every one of its commands into an
      # ephemeral client container, the local ones included, and a local command
      # has no address in it because it is written to run beside the server. The
      # result was `servlo db:create` reaching for a database engine inside a
      # throwaway container that holds none. The client image belongs to the
      # aimed commands, so each of them carries its own.
      tls:
        require: "--ssl-mode=REQUIRED"
        verify-ca: "--ssl-mode=VERIFY_CA --ssl-ca={{ca_cert}}"
      format: sql
      list: >
        $(command -v mysql || command -v mariadb) -h 127.0.0.1 -uroot -sN -e
        "SELECT s.SCHEMA_NAME, COALESCE(SUM(t.DATA_LENGTH + t.INDEX_LENGTH), 0)
        FROM information_schema.SCHEMATA s
        LEFT JOIN information_schema.TABLES t ON t.TABLE_SCHEMA = s.SCHEMA_NAME
        WHERE s.SCHEMA_NAME NOT IN ('information_schema', 'performance_schema', 'mysql', 'sys')
        GROUP BY s.SCHEMA_NAME ORDER BY s.SCHEMA_NAME"
      columns:
        - key: size
          label: Size
          format: bytes
      actions:
        # The aimed commands, for a database servlo does not host. Each carries
        # the client image, because there is no container of servlo's to run it
        # in: the server is somewhere else. Host, port, administrator and TLS
        # spelling come from the connection, and the password arrives in
        # MYSQL_PWD, never in the argv.
        remote_export:
          image: docker.io/library/mysql:8.4
          exec: >
            $(command -v mysqldump || command -v mariadb-dump)
            -h {{host}} -P {{port}} -u {{admin_user}} {{tls_flags}}
            --single-transaction --quick --no-tablespaces --routines --triggers --events
            {{database}}
        remote_import:
          image: docker.io/library/mysql:8.4
          exec: >
            $(command -v mysql || command -v mariadb) --max-allowed-packet=1G
            -h {{host}} -P {{port}} -u {{admin_user}} {{tls_flags}} {{database}}
        remote_create:
          image: docker.io/library/mysql:8.4
          exec: >
            $(command -v mysql || command -v mariadb)
            -h {{host}} -P {{port}} -u {{admin_user}} {{tls_flags}} -e
            'CREATE DATABASE IF NOT EXISTS `{{database}}`;'
        remote_drop:
          image: docker.io/library/mysql:8.4
          exec: >
            $(command -v mysql || command -v mariadb)
            -h {{host}} -P {{port}} -u {{admin_user}} {{tls_flags}} -e
            'DROP DATABASE IF EXISTS `{{database}}`;'
        remote_count_tables:
          image: docker.io/library/mysql:8.4
          exec: >
            $(command -v mysql || command -v mariadb)
            -h {{host}} -P {{port}} -u {{admin_user}} {{tls_flags}} -sN -e
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = '{{database}}'"
        create: >
          $(command -v mysql || command -v mariadb) -h 127.0.0.1 -uroot -e
          'CREATE DATABASE IF NOT EXISTS `{{name}}`;'
        drop:
          exec: >
            $(command -v mysql || command -v mariadb) -h 127.0.0.1 -uroot -e
            'DROP DATABASE IF EXISTS `{{name}}`;'
          destructive: true
        export:
          exec: >
            $(command -v mysqldump || command -v mariadb-dump) -h 127.0.0.1 -uroot
            --single-transaction --quick --no-tablespaces --routines --triggers --events
            {{name}}
          filename: "{{name}}.sql"
        import: >
          $(command -v mysql || command -v mariadb) --max-allowed-packet=1G -h 127.0.0.1 -uroot {{name}}
        export_all: >
          $(command -v mysqldump || command -v mariadb-dump) -h 127.0.0.1 -uroot
          --single-transaction --quick --no-tablespaces --routines --triggers --events
          --add-drop-database --all-databases
        import_all: >
          $(command -v mysql || command -v mariadb) --max-allowed-packet=1G -h 127.0.0.1 -uroot
    # The account a site reaches its own database as, so one site's code cannot
    # read the site next door. Every statement takes its host, port and
    # administrator from the connection the site is on, so the same declaration
    # provisions a container here and a managed server somewhere else.
    - kind: site_users
      image: docker.io/library/mysql:8.4
      tls:
        require: "--ssl-mode=REQUIRED"
        verify-ca: "--ssl-mode=VERIFY_CA --ssl-ca={{ca_cert}}"
      actions:
        create: >
          $(command -v mysql || command -v mariadb) -h {{host}} -P {{port}} -u {{admin_user}} {{tls_flags}} -e
          "CREATE USER IF NOT EXISTS '{{name}}'@'%' IDENTIFIED BY '{{user_password}}';"
        rotate: >
          $(command -v mysql || command -v mariadb) -h {{host}} -P {{port}} -u {{admin_user}} {{tls_flags}} -e
          "ALTER USER '{{name}}'@'%' IDENTIFIED BY '{{user_password}}'; FLUSH PRIVILEGES;"
        grant: >
          $(command -v mysql || command -v mariadb) -h {{host}} -P {{port}} -u {{admin_user}} {{tls_flags}} -e
          "GRANT ALL PRIVILEGES ON \`{{database}}\`.* TO '{{name}}'@'%'; FLUSH PRIVILEGES;"
        drop:
          exec: >
            $(command -v mysql || command -v mariadb) -h {{host}} -P {{port}} -u {{admin_user}} {{tls_flags}} -e
            "DROP USER IF EXISTS '{{name}}'@'%';"
          destructive: true
