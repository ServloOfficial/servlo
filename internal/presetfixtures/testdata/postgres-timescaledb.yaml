name: postgres-timescaledb
description: PostgreSQL with TimescaleDB (time-series extension)
family: postgres
default_version: "17"
versions:
  - tag: "17"
    label: "17 (default)"
    image: docker.io/timescale/timescaledb:latest-pg17
    canonical: true
    host_port: 5432
  - tag: "16"
    label: "16"
    image: docker.io/timescale/timescaledb:latest-pg16
    host_port: 5432
ports:
  - "{{host_port}}:5432"
data_dir: /var/lib/postgresql/data
environment:
  POSTGRES_PASSWORD: servlo
  POSTGRES_DB: servlo
  PGDATA: /var/lib/postgresql/data
env_vars:
  - DB_CONNECTION=pgsql
  - DB_HOST=servlo-{{name}}
  - DB_PORT=5432
  - DB_DATABASE=servlo
  - DB_USERNAME=postgres
  - DB_PASSWORD=servlo
connection_url: postgresql://postgres:servlo@127.0.0.1:{{host_port}}/servlo
site_init:
  exec: psql -U postgres -d {{site}} -c "CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE"
category: databases
icon: elephant
extensions:
  - name: timescaledb
    always: true
