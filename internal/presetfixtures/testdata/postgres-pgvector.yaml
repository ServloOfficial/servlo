name: postgres-pgvector
description: PostgreSQL with pgvector (vector embeddings, no PostGIS)
family: postgres
default_version: "18"
versions:
  - tag: "18"
    label: "18 (default)"
    image: docker.io/pgvector/pgvector:pg18
    canonical: true
    host_port: 5432
  - tag: "17"
    label: "17"
    image: docker.io/pgvector/pgvector:pg17
    host_port: 5432
  - tag: "16"
    label: "16"
    image: docker.io/pgvector/pgvector:pg16
    host_port: 5432
ports:
  - "{{host_port}}:5432"
data_dir: /var/lib/postgresql/data
environment:
  POSTGRES_PASSWORD: servlo
  POSTGRES_DB: servlo
  PGDATA: /var/lib/postgresql/data
env_vars:
  - DB_CONNECTION=pgsql
  - DB_HOST=servlo-{{name}}
  - DB_PORT=5432
  - DB_DATABASE=servlo
  - DB_USERNAME=postgres
  - DB_PASSWORD=servlo
connection_url: postgresql://postgres:servlo@127.0.0.1:{{host_port}}/servlo
category: databases
icon: elephant
extensions:
  - name: vector
    always: true
    types: [vector, halfvec, sparsevec]
