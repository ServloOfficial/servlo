; servlo: devtools collector — engine-level capture for the debug window.
; Read by the servlo_devtools Zend extension. Capture shares one sentinel with
; the debug bridge (enabled.flag), so a single toggle arms both (no FPM
; restart). Do not edit manually.
servlo.devtools_host={{ DEVTOOLS_TARGET }}
servlo.devtools_kinds={{ DEVTOOLS_KINDS }}
servlo.devtools_flag=/usr/local/etc/servlo/enabled.flag
