version: 2

project_name: servlo

before:
  hooks:
    - go mod tidy

builds:
  - id: servlo-amd64
    main: ./cmd/servlo
    binary: servlo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X github.com/realrashid/servlo/internal/version.Version={{.Version}}
      - -X github.com/realrashid/servlo/internal/version.Commit={{.Commit}}
      - -X github.com/realrashid/servlo/internal/version.Date={{.Date}}

  - id: servlo-arm64
    main: ./cmd/servlo
    binary: servlo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X github.com/realrashid/servlo/internal/version.Version={{.Version}}
      - -X github.com/realrashid/servlo/internal/version.Commit={{.Commit}}
      - -X github.com/realrashid/servlo/internal/version.Date={{.Date}}

  - id: servlo-darwin-amd64
    main: ./cmd/servlo
    binary: servlo
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X github.com/realrashid/servlo/internal/version.Version={{.Version}}
      - -X github.com/realrashid/servlo/internal/version.Commit={{.Commit}}
      - -X github.com/realrashid/servlo/internal/version.Date={{.Date}}

  - id: servlo-darwin-arm64
    main: ./cmd/servlo
    binary: servlo
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X github.com/realrashid/servlo/internal/version.Version={{.Version}}
      - -X github.com/realrashid/servlo/internal/version.Commit={{.Commit}}
      - -X github.com/realrashid/servlo/internal/version.Date={{.Date}}

archives:
  - id: servlo-amd64
    ids: [servlo-amd64]
    name_template: "servlo_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    files:
      - README.md
      - install.sh

  - id: servlo-arm64
    ids: [servlo-arm64]
    name_template: "servlo_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    files:
      - README.md
      - install.sh

  - id: servlo-darwin-amd64
    ids: [servlo-darwin-amd64]
    name_template: "servlo_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    files:
      - README.md
      - install.sh

  - id: servlo-darwin-arm64
    ids: [servlo-darwin-arm64]
    name_template: "servlo_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    files:
      - README.md
      - install.sh

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: "^feat"
      order: 0
    - title: Bug Fixes
      regexp: "^fix"
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: realrashid
    name: servlo
  name_template: "v{{ .Version }}"
  draft: false
  prerelease: auto
  replace_existing_artifacts: true
  header: |
    ## Servlo {{ .Version }}

    Servlo — production PHP server panel for Ubuntu 24.04 LTS.

    ### Install

    ```bash
    curl -fsSL https://raw.githubusercontent.com/realrashid/servlo/main/install.sh | bash
    ```

    Or if already installed:

    ```bash
    servlo update
    ```

  footer: |
    **Full Changelog**: https://github.com/realrashid/servlo/compare/{{ .PreviousTag }}...{{ .Tag }}
